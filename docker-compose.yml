services:
  web:
    image: python-django
    container_name: django-openfga-app
    build:
       context: .
       dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - openfga
    env_file:
      - .env
    volumes:
      - .:/app

  event-listener:
    image: python-django
    container_name: django-openfga-event-listener
    build:
       context: .
       dockerfile: Dockerfile
    command: python manage.py listen_pg_events
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app

  inngest:
    image: inngest/inngest:latest
    container_name: django-openfga-inngest
    command: inngest dev --host 0.0.0.0 -u http://web:8000/api/inngest
    ports:
      - "8288:8288"
    depends_on:
      - web

  db:
    image: postgres:16
    container_name: django-openfga-db
    command: postgres -c wal_level=logical
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_USER=eventops_user
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=django_openfga_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventops_user -d django_openfga_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-db:
    image: postgres:16
    container_name: django-openfga-fga-db
    volumes:
      - openfga-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=openfga
      - POSTGRES_PASSWORD=openfga
      - POSTGRES_DB=openfga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:latest
    container_name: django-openfga-migrate
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db:
        condition: service_healthy

  openfga:
    image: openfga/openfga:latest
    container_name: django-openfga-server
    command: run
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
      - OPENFGA_PLAYGROUND_ENABLED=true
    ports:
      - "8080:8080"
      - "8081:8081"
      - "3000:3000"
    depends_on:
      openfga-db:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  openfga-postgres-data:
